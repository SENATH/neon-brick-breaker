# OpenChoreo Component manifest for Neon Brick Breaker
# Compatible with OpenChoreo release v1.0 (v1alpha1 API)
#
# Schema note: parameters must be nested inside spec.workflow, not at spec level.
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: neon-brick-breaker
  namespace: default
spec:
  owner:
    projectName: default

  componentType:
    kind: ClusterComponentType
    name: deployment/web-application

  autoDeploy: true

  workflow:
    kind: ClusterWorkflow
    name: paketo-buildpacks-builder
    parameters:
      repository:
        url: "https://github.com/SENATH/neon-brick-breaker"
        revision:
          branch: "main"
        appPath: "/"
      buildEnv:
        - name: BP_NODE_RUN_SCRIPTS
          value: "build"
        - name: BP_WEB_SERVER
          value: "nginx"
        - name: BP_WEB_SERVER_ROOT
          value: "build"
        - name: BP_WEB_SERVER_ENABLE_PUSH_STATE
          value: "true"
        - name: BP_NODE_VERSION
          value: "24"
        - name: PORT
          value: "80"

---
apiVersion: openchoreo.dev/v1alpha1
kind: WorkflowRun
metadata:
  name: neon-brick-breaker-build-01
  labels:
    openchoreo.dev/project: "default"
    openchoreo.dev/component: "neon-brick-breaker"
spec:
  workflow:
    kind: ClusterWorkflow
    name: paketo-buildpacks-builder
    parameters:
      repository:
        url: "https://github.com/SENATH/neon-brick-breaker"
        revision:
          branch: "main"
        appPath: "/"
      buildEnv:
        - name: BP_NODE_RUN_SCRIPTS
          value: "build"
        - name: BP_WEB_SERVER
          value: "nginx"
        - name: BP_WEB_SERVER_ROOT
          value: "build"
        - name: BP_WEB_SERVER_ENABLE_PUSH_STATE
          value: "true"
        - name: BP_NODE_VERSION
          value: "24"
        - name: PORT
          value: "80"
